<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raumplanung</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>Raumplanung</h1><p>Maßstabsgetreuer 2D-Plan · Maße in Metern</p></div><button id="resetBtn" class="secondary">Plan zurücksetzen</button></header>
<main><aside>
<section><h2>Raum</h2><div class="grid2"><label>Länge<input id="roomW" type="number" step="0.001" value="5.464"></label><label>Breite<input id="roomH" type="number" step="0.001" value="3.222"></label></div><button id="applyRoom">Raummaße übernehmen</button></section>
<section><h2>Bauliche Elemente</h2><p class="hint">Balkonwand ist links. Eingang ist unten rechts auf der langen Wand.</p><label>Nische vor Balkontür<input id="niche" type="number" step="0.001" value="0.514"></label><label>Balkontür Breite<input id="balconyW" type="number" step="0.001" value="1.25"></label><label>Eingangstür Breite<input id="entryW" type="number" step="0.01" value="0.80"></label><button id="applyFixed">Bauliche Elemente aktualisieren</button></section>
<section><h2>Möbel hinzufügen</h2><label>Name<input id="fName" placeholder="z. B. Bett"></label><div class="grid2"><label>Breite<input id="fW" type="number" step="0.01" value="1.40"></label><label>Tiefe<input id="fH" type="number" step="0.01" value="2.00"></label></div><button id="addFurniture">Möbel spawnen</button></section>
<section id="selectedPanel" class="hidden"><h2>Ausgewählt</h2><label>Name<input id="sName"></label><div class="grid2"><label>Breite<input id="sW" type="number" step="0.01"></label><label>Tiefe<input id="sH" type="number" step="0.01"></label></div><div class="actions"><button id="rotateBtn">90° drehen</button><button id="deleteBtn" class="danger">Löschen</button></div><p id="positionInfo" class="hint"></p></section>
</aside><div class="workspace"><div class="legend"><span><i class="door"></i>Balkontür</span><span><i class="entry"></i>Eingang</span><span><i class="window"></i>Fenster + Heizkörper</span><span><i class="furniture"></i>Möbel</span></div><div id="stage"><div id="room"></div></div><p class="help">Draufsicht: links Balkon, unten rechts Eingang. Möbel anklicken und ziehen.</p></div></main><script src="app.js"></script></body></html>
